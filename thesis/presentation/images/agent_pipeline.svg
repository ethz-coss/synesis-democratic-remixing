<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 540" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1f425e"/>
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#e8a87c"/>
    </marker>
  </defs>

  <!-- ═══ Phase 1: Root Creation Check ═══ -->
  <rect x="45" y="12" width="340" height="68" rx="12" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="45" y="12" width="5" height="68" rx="3" fill="#e8a87c"/>
  <circle cx="74" cy="34" r="14" fill="#e8a87c"/>
  <text x="74" y="39" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
  <text x="98" y="39" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#1e293b">Root Creation Check</text>
  <text x="215" y="63" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#64748b" text-anchor="middle">p = 0.03, damped by #roots &amp; authorship</text>

  <!-- yes → CREATE ROOT pill -->
  <line x1="385" y1="46" x2="420" y2="46" stroke="#e8a87c" stroke-width="2" marker-end="url(#arr-p)"/>
  <text x="402" y="39" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#e8a87c" text-anchor="middle">yes</text>
  <rect x="428" y="30" width="108" height="32" rx="16" fill="#e8a87c" filter="url(#shadow)"/>
  <text x="482" y="51" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">CREATE ROOT</text>

  <!-- no ↓ -->
  <line x1="215" y1="80" x2="215" y2="118" stroke="#1f425e" stroke-width="2" marker-end="url(#arr)"/>
  <text x="227" y="104" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#1f425e">no</text>

  <!-- ═══ Phase 2: Compile Attention Pool ═══ -->
  <rect x="45" y="126" width="340" height="88" rx="12" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="45" y="126" width="5" height="88" rx="3" fill="#e8a87c"/>
  <circle cx="74" cy="148" r="14" fill="#e8a87c"/>
  <text x="74" y="153" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
  <text x="98" y="153" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#1e293b">Compile Attention Pool</text>
  <text x="215" y="178" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#64748b" text-anchor="middle">Siphon (3) + Ballot (3) + PersonalFocus (5)</text>
  <text x="215" y="200" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="600" fill="#1f425e" text-anchor="middle">≤ 11 candidates per session</text>

  <!-- ↓ -->
  <line x1="215" y1="214" x2="215" y2="252" stroke="#1f425e" stroke-width="2" marker-end="url(#arr)"/>

  <!-- ═══ Phase 3: Select Targets ═══ -->
  <rect x="45" y="260" width="340" height="68" rx="12" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="45" y="260" width="5" height="68" rx="3" fill="#e8a87c"/>
  <circle cx="74" cy="282" r="14" fill="#e8a87c"/>
  <text x="74" y="287" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
  <text x="98" y="287" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#1e293b">Select Targets</text>
  <text x="215" y="312" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#64748b" text-anchor="middle">k ∈ [1, 3], greedy by perceived utility u(s)</text>

  <!-- ↓ -->
  <line x1="215" y1="328" x2="215" y2="366" stroke="#1f425e" stroke-width="2" marker-end="url(#arr)"/>

  <!-- ═══ Phase 4: Action Selection ═══ -->
  <rect x="45" y="374" width="430" height="155" rx="12" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="45" y="374" width="5" height="155" rx="3" fill="#56a7ad"/>
  <circle cx="74" cy="396" r="14" fill="#56a7ad"/>
  <text x="74" y="401" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
  <text x="98" y="401" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#1e293b">Action Selection</text>
  <text x="98" y="418" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-style="italic" fill="#94a3b8">for each selected target</text>

  <!-- Divider -->
  <line x1="65" y1="428" x2="455" y2="428" stroke="#e5e7eb" stroke-width="1"/>

  <!-- Path A: Siphon notification -->
  <rect x="72" y="440" width="16" height="16" rx="4" fill="#56a7ad"/>
  <text x="80" y="452" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">A</text>
  <text x="98" y="452" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="600" fill="#56a7ad">Siphon notification</text>
  <text x="98" y="469" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#1e293b">→ migrate subscription if u(child) &gt; u(parent)</text>

  <!-- Path B: Standard roll -->
  <rect x="72" y="483" width="16" height="16" rx="4" fill="#e8a87c"/>
  <text x="80" y="495" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">B</text>
  <text x="98" y="495" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="600" fill="#e8a87c">Standard</text>
  <text x="98" y="512" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#1e293b">→ roll: vote (.72) | remix (.15) | merge (.05)</text>

</svg>
