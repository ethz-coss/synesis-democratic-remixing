<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 650" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
    <linearGradient id="edge-grad-1" gradientUnits="userSpaceOnUse" x1="-220" y1="160" x2="0" y2="-120">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="edge-grad-2" gradientUnits="userSpaceOnUse" x1="0" y1="-120" x2="220" y2="160">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="edge-grad-3" gradientUnits="userSpaceOnUse" x1="220" y1="160" x2="-220" y2="160">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff" />
  
  <g transform="translate(400, 320)">
    
    <text x="0" y="-250" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="700" fill="#1e293b" text-anchor="middle">The Democratic Trilemma</text>
    <text x="0" y="-220" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-style="italic" fill="#64748b" text-anchor="middle">According to James Fishkin</text>

    <path d="M -220,160 L 0,-120" stroke="url(#edge-grad-1)" stroke-width="24" fill="none" stroke-linecap="round"/>
    <path d="M 0,-120 L 220,160" stroke="url(#edge-grad-2)" stroke-width="24" fill="none" stroke-linecap="round"/>
    <path d="M 220,160 L -220,160" stroke="url(#edge-grad-3)" stroke-width="24" fill="none" stroke-linecap="round"/>

    <g transform="translate(-110, 20) rotate(-51.8)">
      <rect x="-90" y="-24" width="180" height="48" rx="24" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" opacity="0.95"/>
      <text x="0" y="5" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#334155" text-anchor="middle">Unequal Influence</text>
    </g>
    
    <g transform="translate(110, 20) rotate(51.8)">
      <rect x="-90" y="-24" width="180" height="48" rx="24" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" opacity="0.95"/>
      <text x="0" y="5" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#334155" text-anchor="middle">Minipublics</text>
    </g>
    
    <g transform="translate(0, 160)">
      <rect x="-90" y="-24" width="180" height="48" rx="24" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" opacity="0.95"/>
      <text x="0" y="5" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#334155" text-anchor="middle">Raw Public Opinion</text>
    </g>

    <circle cx="0" cy="-120" r="75" fill="#8b5cf6" filter="url(#shadow)"/>
    <text x="0" y="-113" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">Deliberation</text>
    
    <circle cx="-220" cy="160" r="75" fill="#3b82f6" filter="url(#shadow)"/>
    <text x="-220" y="153" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">Mass</text>
    <text x="-220" y="177" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">Participation</text>

    <circle cx="220" cy="160" r="75" fill="#10b981" filter="url(#shadow)"/>
    <text x="220" y="153" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">Political</text>
    <text x="220" y="177" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">Equality</text>
  </g>
</svg>
