<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" width="100%" height="100%">
  <defs>
    <!-- Arrow heads -->
    <marker id="arrow-peach" viewBox="0 0 10 10" refX="15" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#e8a87c"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="15" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#56a7ad"/>
    </marker>
    
    <!-- Gradient for merged node -->
    <linearGradient id="merge-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="20%" stop-color="#e8a87c" />
      <stop offset="80%" stop-color="#56a7ad" />
    </linearGradient>
  </defs>

  <!-- Edges (Smooth Bezier Curves) -->
  <path d="M 100 130 C 250 130, 250 60, 400 60" stroke="#e8a87c" stroke-width="5" fill="none" marker-end="url(#arrow-peach)" />
  <path d="M 100 130 C 250 130, 250 200, 400 200" stroke="#e8a87c" stroke-width="5" fill="none" marker-end="url(#arrow-peach)" />
  <path d="M 100 320 C 250 320, 250 320, 400 320" stroke="#56a7ad" stroke-width="5" fill="none" marker-end="url(#arrow-teal)" />
  
  <path d="M 400 200 C 550 200, 550 260, 700 260" stroke="#e8a87c" stroke-width="5" fill="none" marker-end="url(#arrow-peach)" />
  <path d="M 400 320 C 550 320, 550 260, 700 260" stroke="#56a7ad" stroke-width="5" fill="none" marker-end="url(#arrow-teal)" />
  <path d="M 400 320 C 550 320, 550 380, 700 380" stroke="#56a7ad" stroke-width="5" fill="none" marker-end="url(#arrow-teal)" />

  <!-- Nodes -->
  <!-- Roots -->
  <circle cx="100" cy="130" r="25" fill="#e8a87c" />
  <circle cx="100" cy="320" r="25" fill="#56a7ad" />
  
  <!-- Edits -->
  <circle cx="400" cy="60" r="25" fill="#e8a87c" />
  <circle cx="400" cy="200" r="25" fill="#e8a87c" />
  <circle cx="400" cy="320" r="25" fill="#56a7ad" />
  
  <!-- Merges & Final Leaf -->
  <circle cx="700" cy="260" r="25" fill="url(#merge-grad)" />
  <circle cx="700" cy="380" r="25" fill="#56a7ad" />
</svg>
